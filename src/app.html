<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Ejercicios de rehabilitación para afasia y anomia" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/icons/icon-192.png" />
    %sveltekit.head%
    <script>
      // Pre-paint theme bootstrap — avoids a flash of the wrong theme.
      // :root defaults to dark CSS tokens; .light-theme overrides them.
      // localStorage caches the user's choice for returning visitors;
      // new users fall back to prefers-color-scheme (matching initDefaults).
      (function () {
        try {
          var t = localStorage.getItem('habla-anomia:theme');
          if (t == null)
            t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (t === 'light') document.documentElement.classList.add('light-theme');
        } catch (e) { /* matchMedia/localStorage unavailable — dark is fine */ }
      })();
    </script>
  </head>
  <body data-sveltekit-preload-data="tap">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
